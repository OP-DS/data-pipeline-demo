name: data-pipeline-workflow

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  run-data-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install jupyter

      - name: Run data pipeline
        run: jupyter nbconvert --to notebook --execute data_pipeline_OD.ipynb --output executed_data_pipeline_OD.ipynb --ExecutePreprocessor.timeout=-1

      - name: Commit and push if changes
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Update output Excel file"
            git push
          fi